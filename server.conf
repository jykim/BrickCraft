# Shared BrickCraft server (Admin BrickCraft.command). Local network play only.
server_name = BrickCraft Workshop
server_description = A peaceful brick workshop for family builders
motd = Welcome to BrickCraft! Press ? or type /keys for help, /who to see builders.
server_announce = false
max_users = 8
default_privs = interact, shout
enable_damage = false
creative_mode = false
disallow_empty_password = false
time_speed = 0
mg_name = singlenode
# AI builders: every player has their own (named with /botname; "bot, build a red castle").
# Designs come from Claude Code through the host's Local AI API.
brickcraft_ai_builder = true
# jms, the host's builder who looks after the Workshop on his own: off for now.
brickcraft_ai_jms = false
brickcraft_ai_url = http://127.0.0.1:8099/claude/v1/chat/completions
brickcraft_ai_model = opus
secure.http_mods = brickcraft_ai

# Authenticated world API transport; see docs/WORLD_API.md.
brickcraft_world_api = true
